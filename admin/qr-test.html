<!DOCTYPE html>
<html>
<head>
    <title>QR Library Test</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <h1>QR Library Test</h1>
    <div id="reader" style="width:500px"></div>
    <p id="status">Checking...</p>
    
    <script>
        const status = document.getElementById('status');
        
        if (typeof Html5Qrcode !== 'undefined') {
            status.innerHTML = '✅ Html5Qrcode library loaded!';
            status.style.color = 'green';
            
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 },
                (decodedText) => {
                    status.innerHTML = '✅ Scanned: ' + decodedText;
                },
                (errorMessage) => {
                    // scanning
                }
            ).catch(err => {
                status.innerHTML = '❌ Camera error: ' + err;
                status.style.color = 'red';
            });
        } else {
            status.innerHTML = '❌ Html5Qrcode library NOT loaded!';
            status.style.color = 'red';
        }
    </script>
</body>
</html>
